<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    
    .status {
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* 3x3 Grid Layout */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      margin-bottom: 20px;
      background-color: #333;
      padding: 5px;
      border-radius: 8px;
    }

    .cell {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      background-color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .cell:hover {
      background-color: #f0f0f0;
    }

    /* Restart Button Styling */
    button {
      padding: 10px 24px;
      font-size: 1.1rem;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="status" id="status">Player X's Turn</div>
  
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  
  <button id="restart">Restart Game</button>

  <script>
    // DOM Elements
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const restartBtn = document.getElementById('restart');

    // Game State Variables
    let boardState = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let isGameActive = true;

    // All possible winning combinations (rows, columns, diagonals)
    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], 
      [0, 3, 6], [1, 4, 7], [2, 5, 8], 
      [0, 4, 8], [2, 4, 6]             
    ];

    // Handle a cell being clicked
    function handleCellClick(event) {
      const clickedCell = event.target;
      const cellIndex = clickedCell.getAttribute('data-index');

      // Prevent interaction if cell is already filled or game is over
      if (boardState[cellIndex] !== '' || !isGameActive) {
        return;
      }

      // Update state and UI
      boardState[cellIndex] = currentPlayer;
      clickedCell.innerText = currentPlayer;
      clickedCell.style.color = currentPlayer === 'X' ? '#e74c3c' : '#3498db';

      checkWinValidation();
    }

    // Check if the current move resulted in a win or draw
    function checkWinValidation() {
      let roundWon = false;

      for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        statusText.innerText = `Player ${currentPlayer} Wins!`;
        isGameActive = false;
        return;
      }

      // Check for draw (no empty strings left in the array)
      if (!boardState.includes('')) {
        statusText.innerText = 'Game ended in a Draw!';
        isGameActive = false;
        return;
      }

      // Switch players if no win or draw
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusText.innerText = `Player ${currentPlayer}'s Turn`;
    }

    // Reset the game state and UI
    function restartGame() {
      boardState = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      isGameActive = true;
      statusText.innerText = `Player X's Turn`;
      
      cells.forEach(cell => {
        cell.innerText = '';
      });
    }

    // Attach Event Listeners
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    restartBtn.addEventListener('click', restartGame);
  </script>
</body>
</html>
